[package]
name = "calendar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10.4"
icalendar = { version = "0.17.12", features = ["chrono-tz"] }
rrule = "0.14.0"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22"] }
oo7 = { version = "0.7.0-alpha", default-features = false, features = ["tokio", "native_crypto"] }
quick-xml = "0.41.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.31.0", features = ["bundled", "chrono", "uuid"] }
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1.23.3", default-features = false, features = ["serde", "std", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

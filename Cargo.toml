[package]
name = "calendar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
gtk = { version = "0.11.4", package = "gtk4" }
uuid = { version = "1.23.3", default-features = false, features = ["serde", "std", "v4"] }
